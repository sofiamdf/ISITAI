AWSTemplateFormatVersion: '2010-09-09'
Description: aidet - caché de resultados en DynamoDB con TTL
Resources:
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: aidet-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: aidet
Outputs:
  CacheTableName:
    Value: !Ref CacheTable
    Export:
      Name: aidet-CacheTableName