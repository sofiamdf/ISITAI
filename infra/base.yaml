AWSTemplateFormatVersion: '2010-09-09'
Description: isitai - buckets S3 (web por HTTPS y dataset)

Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub isitai-web-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: isitai

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadWeb
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
          - Sid: DenyHttp
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub ${WebBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  DatasetBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub isitai-dataset-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: limpiar-versiones-viejas
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: isitai

Outputs:
  WebBucket:
    Value: !Ref WebBucket
  DatasetBucket:
    Value: !Ref DatasetBucket
  WebUrl:
    Value: !Sub https://${WebBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/index.html
  WebOrigin:
    Value: !Sub https://${WebBucket}.s3.${AWS::Region}.${AWS::URLSuffix}