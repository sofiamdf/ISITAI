name: ci
on:
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi
      - name: Run Pytest
        run: |
          # 5 = pytest no encontró pruebas
          if [ -d backend/tests ]; then pytest backend/tests || { code=$?; [ "$code" -eq 5 ] || exit "$code"; }; fi

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Lint CloudFormation Templates
        run: |
          pip install cfn-lint
          shopt -s nullglob
          files=(infra/*.yaml)
          if [ ${#files[@]} -gt 0 ]; then cfn-lint "${files[@]}"; fi
